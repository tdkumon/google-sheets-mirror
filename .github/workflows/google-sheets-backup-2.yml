name: Automated Sheet & Progress Log Backup

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Download and Validate CSVs
        run: |
          set -e

          # Ensure the csv directory exists
          mkdir -p csv

          # Download Tracking Sheets into csv/ folder
          curl -f -s -S -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSefBKOLNnZz6gFB_slcy9mZYN6V19w2sLYyUcR0yQdjK8Li7RVQrhA4pj7pRG4NjzIUVbrpsOXR14u/pub?gid=0&single=true&output=csv" -o csv/trackingsheet-2026.csv
          curl -f -s -S -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSefBKOLNnZz6gFB_slcy9mZYN6V19w2sLYyUcR0yQdjK8Li7RVQrhA4pj7pRG4NjzIUVbrpsOXR14u/pub?gid=1563791943&single=true&output=csv" -o csv/trackingsheet-2025.csv
          curl -f -s -S -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vSefBKOLNnZz6gFB_slcy9mZYN6V19w2sLYyUcR0yQdjK8Li7RVQrhA4pj7pRG4NjzIUVbrpsOXR14u/pub?gid=531912198&single=true&output=csv" -o csv/trackingsheet-2024.csv

          # Download Progress Log into csv/ folder
          curl -f -s -S -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTgxlKcxV9xO4kuqD0EMA4lzYhFuOXIXY1nRYMCDG81WEetN54vXwX5sLPn0zg783nsc2WS8HqamWZV/pub?output=csv" -o csv/progresslog.csv

          # 1. Generic checks: Non-empty and not an HTML web page
          for f in csv/trackingsheet-*.csv csv/progresslog.csv; do
            if [ ! -s "$f" ]; then
              echo "Error: $f is empty."
              exit 1
            fi
            if head -n 1 "$f" | grep -qiE "<html|<!doctype"; then
              echo "Error: $f contains HTML instead of CSV (likely a Google error page)."
              exit 1
            fi
          done

          # 2. Strict validation: Verify expected content/headers in files
          if ! head -n 5 csv/progresslog.csv | grep -qi "daily progress log"; then
            echo "Error: progresslog.csv failed validation (missing 'daily progress log' marker)."
            exit 1
          fi

          for ts in csv/trackingsheet-*.csv; do
            if ! head -n 5 "$ts" | grep -qi "tracking sheet"; then
              echo "Error: $ts failed validation (missing 'tracking sheet' marker)."
              exit 1
            fi
          done

      - name: Download and Resize Missing Thumbnails
        run: |
          python - << 'EOF'
          import os
          import csv
          import requests
          from pathlib import Path
          from PIL import Image
          from io import BytesIO

          thumbs_dir = Path("thumbs")
          thumbs_dir.mkdir(exist_ok=True)

          # Parse CSV files for missing thumbnails
          for csv_file in Path("csv").glob("trackingsheet-*.csv"):
              with open(csv_file, mode="r", encoding="utf-8") as f:
                  reader = csv.reader(f)
                  for row in reader:
                      try:
                          if len(row) > 13:
                              entry_id = row[12].strip()
                              thumb_url = row[13].strip()

                              if entry_id and thumb_url.startswith("http"):
                                  file_path = thumbs_dir / f"{entry_id}.png"
                                  
                                  # Only fetch if the thumbnail does not already exist
                                  if not file_path.exists():
                                      headers = {'User-Agent': 'Mozilla/5.0'}
                                      resp = requests.get(thumb_url, headers=headers, timeout=15)
                                      if resp.status_code == 200:
                                          # Open image from downloaded bytes, resize, and optimize
                                          img = Image.open(BytesIO(resp.content))
                                          
                                          # Convert to RGB if it's RGBA/palette mode and saving as PNG (or keep transparency)
                                          if img.mode in ("RGBA", "P"):
                                              img = img.convert("RGBA")
                                          else:
                                              img = img.convert("RGB")
                                          
                                          # Resize maintaining aspect ratio (e.g., max width/height 200px)
                                          img.thumbnail((200, 200), Image.Resampling.LANCZOS)
                                          
                                          # Save optimized image locally
                                          img.save(file_path, "PNG", optimize=True)
                                          print(f"Downloaded, resized, and compressed thumbnail for {entry_id}")
                      except Exception as e:
                          print(f"Skipping row error in {csv_file}: {e}")
          EOF

      - name: Commit and Push Updated Backups
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u +"%d/%m/%Y %H:%M UTC")
          CHANGES_MADE=false

          # Check Tracking Sheet changes
          git add csv/trackingsheet-*.csv
          if ! git diff --quiet --staged; then
            echo "$TIMESTAMP" > trackingsheet-last-updated.txt
            git add trackingsheet-last-updated.txt
            CHANGES_MADE=true
          fi

          # Check Progress Log changes
          git add csv/progresslog.csv
          if ! git diff --quiet --staged; then
            echo "$TIMESTAMP" > progresslog-last-updated.txt
            git add progresslog-last-updated.txt
            CHANGES_MADE=true
          fi

          # Check Thumbnails directory changes
          git add thumbs/*.png 2>/dev/null || true
          if ! git diff --quiet --staged; then
            CHANGES_MADE=true
          fi

          # Commit and push only if actual changes occurred
          if [ "$CHANGES_MADE" = true ]; then
            git commit -m "Auto-update sheet backups and thumbnails [skip ci]"
            git push
          fi
