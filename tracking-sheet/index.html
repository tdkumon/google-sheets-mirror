<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tdk's tracking sheet</title>
    <meta
      name="description"
      content="tracking sheet for anime/manga/games etc."
    />
    <!--<link rel="icon" type="image/png" href="../media/shinobu.png" />-->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="tdk's tracking sheet" />
    <meta
      property="og:description"
      content="tracking sheet for anime/manga/games etc."
    />
    <meta
      property="og:image"
      content="https://tdkumon.github.io/google-sheets-mirror/media/shinobu.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="tdk's tracking sheet" />
    <meta
      name="twitter:description"
      content="tracking sheet for anime/manga/games etc."
    />
    <meta
      name="twitter:image"
      content="https://tdkumon.github.io/google-sheets-mirror/media/shinobu.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&family=Noto+Sans+JP:wght@700;900&family=Noto+Sans:wght@400;700&family=Roboto:wght@400;700&family=Shippori+Mincho:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/tracking-sheet.css" />
  </head>

  <body data-year="2026">
    <div class="header-section">
      <div class="header-container">
        <img
          src="../media/shinobu.png"
          alt="nobu"
          class="header-img"
          width="135"
          height="135"
        />
        <div class="header-text">
          <h1>tdk's awesome tracking sheet 🚧 WIP</h1>
          <p style="font-size: 24px">
            i put everything in here that seems relevant to me
          </p>
        </div>
      </div>
      <div class="links-container">
        <a
          href="https://docs.google.com/spreadsheets/d/1Ey6jeAc_H16xKjr0d8YyihVJMkc9CQwN_R9W9XUOHpU"
          target="_blank"
          rel="noopener"
          >google sheets version</a
        >
        <a href="https://rentry.co/tdkumon" target="_blank" rel="noopener"
          >rentry page</a
        >
        <a href="../progress-log/" target="_blank" rel="noopener"
          >full progress log of everything in here w/ daily time/episode/chapter
          tracking etc.</a
        >
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('2026')">2026</button>
      <button class="tab-btn" onclick="switchTab('2025')">2025</button>
      <button class="tab-btn" onclick="switchTab('2024')">2024</button>
    </div>

    <div class="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="Search by title..."
        oninput="handleSearch()"
      />
      <select id="type-filter" onchange="handleSearch()">
        <option value="All">All Types</option>
        <option value="Anime">Anime</option>
        <option value="Manga">Manga</option>
        <option value="Film">Film</option>
        <option value="TV Show">TV Show</option>
        <option value="Visual Novel">Visual Novel</option>
        <option value="Book">Book</option>
        <option value="Game">Game</option>
        <option value="Anime (Film)">Anime (Film)</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div id="table-container">Loading data...</div>

    <div id="last-updated" class="last-updated-badge">
      Loading update time...
    </div>

    <img src="../media/nobu.png" alt="nobu" class="bottom-right-shinobu" />

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="../scripts/tracking-sheet.js"></script>
  </body>
</html>
